
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lamp Pull Switch Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #101113;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    transition: background 0.7s ease;
}

body.light-on {
    background: radial-gradient(
        ellipse at 30% 42%,
        #514b36 0%,
        #292a26 38%,
        #101113 78%
    );
}

.scene {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 100px;
    padding: 30px;
}

/* Lamp */

.lamp-area {
    position: relative;
    width: 300px;
    height: 430px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    margin-top: 20px;
}

.lamp-glow {
    position: absolute;
    top: -30px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: #e8d88a;
    filter: blur(100px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
}

.light-on .lamp-glow {
    opacity: 0.32;
}

.shade {
    position: relative;
    z-index: 1;
    width: 240px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 125px 125px 30px 30px;
    background: #fffdf4;
    transition: box-shadow 0.6s ease;
}

.light-on .shade {
    box-shadow: 0 0 45px 15px rgba(255, 239, 167, 0.65);
}

.stand {
    position: relative;
    z-index: 1;
    width: 14px;
    height: 275px;
    flex-shrink: 0;
    background: #f6f3e4;
}

.base {
    position: relative;
    z-index: 1;
    width: 110px;
    height: 14px;
    flex-shrink: 0;
    border-radius: 20px;
    background: #f6f3e4;
}

/* Pull string and switch */

.string {
    position: absolute;
    z-index: 5;
    left: calc(50% + 45px);
    top: 115px;
    width: 2px;
    height: 150px;
    background: #6c6a5c;
    transform-origin: top;
}

.string.dragging {
    transition: none;
}

.pull-switch {
    position: absolute;
    left: -10px;
    bottom: -18px;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 2px solid #8e7957;
    border-radius: 50%;
    background: #e7cda0;
    cursor: grab;
    touch-action: none;
    user-select: none;
    box-shadow: 0 0 10px rgba(231, 205, 160, 0.3);
}

.pull-switch:active {
    cursor: grabbing;
    box-shadow: 0 0 18px #e7c66f;
}

.pull-switch:focus-visible {
    outline: 3px solid #f5df8b;
    outline-offset: 5px;
}

/* Login dashboard */

.login-card {
    width: 380px;
    max-width: 100%;
    padding: 42px 35px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 32px;
    background: rgba(130, 128, 115, 0.18);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(12px);

    opacity: 0;
    visibility: hidden;
    transform: translateY(25px) scale(0.96);
    transition:
        opacity 0.6s ease,
        transform 0.6s ease,
        visibility 0.6s;
    pointer-events: none;
}

.light-on .login-card {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

h1 {
    text-align: center;
    font-size: 34px;
    margin-bottom: 40px;
}

label {
    display: block;
    margin-bottom: 12px;
    color: #b7b4a8;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 16px;
    margin-bottom: 30px;
    border: 1px solid #66645a;
    border-radius: 24px;
    outline: none;
    background: rgba(255, 255, 255, 0.09);
    color: white;
    font-size: 16px;
}

input::placeholder {
    color: #aaa99e;
}

input:focus {
    border-color: #e8d77d;
    box-shadow: 0 0 10px rgba(232, 215, 125, 0.2);
}

button[type="submit"] {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 22px;
    background: linear-gradient(
        110deg,
        #c8b448,
        #fff6a9,
        #c6ad3e
    );
    color: #292719;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(238, 218, 110, 0.25);
}

#message {
    margin-top: 18px;
    color: #f5e8a0;
    font-size: 14px;
    text-align: center;
}

.hint {
    position: fixed;
    bottom: 24px;
    left: 0;
    width: 100%;
    padding: 0 15px;
    color: #a9a89f;
    font-size: 13px;
    text-align: center;
}

/* Mobile responsive */

@media (max-width: 800px) {
    .scene {
        flex-direction: column;
        gap: 20px;
        padding: 30px 20px 65px;
    }

    .lamp-area {
        transform: scale(0.78);
        height: 340px;
        margin-bottom: -25px;
    }

    .login-card {
        width: 380px;
        padding: 35px 25px;
    }

    h1 {
        margin-bottom: 30px;
    }

    .hint {
        bottom: 12px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- Lamp -->

    <div class="lamp-area">

        <div class="lamp-glow"></div>

        <div class="shade"></div>

        <div class="stand"></div>

        <div class="base"></div>

        <div class="string" id="string">

            <button
                class="pull-switch"
                id="lampSwitch"
                type="button"
                aria-label="Pull down to turn lamp on"
                aria-pressed="false"
                title="Drag down to switch the lamp">

            </button>

        </div>

    </div>

    <!-- Login Dashboard -->

    <div class="login-card" id="loginCard">

        <h1>Welcome</h1>

        <form id="loginForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="@email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In</button>

            <p id="message" role="status"></p>

        </form>

    </div>

</div>

<p class="hint" id="hint">
    Pull the little ball down to turn on the light
</p>

<script>
const lampSwitch = document.getElementById("lampSwitch");
const string = document.getElementById("string");
const hint = document.getElementById("hint");
const username = document.getElementById("username");
const password = document.getElementById("password");
const message = document.getElementById("message");
const loginForm = document.getElementById("loginForm");

let dragging = false;
let startY = 0;
let pullDistance = 0;

const originalStringHeight = 150;
const maxPullDistance = 90;
const pullThreshold = 45;

lampSwitch.addEventListener("pointerdown", function(event) {
    dragging = true;
    startY = event.clientY;
    pullDistance = 0;

    string.classList.add("dragging");
    lampSwitch.setPointerCapture(event.pointerId);
});

lampSwitch.addEventListener("pointermove", function(event) {
    if (!dragging) return;

    pullDistance = Math.max(
        0,
        Math.min(event.clientY - startY, maxPullDistance)
    );

    string.style.height =
        (originalStringHeight + pullDistance) + "px";
});

function releaseSwitch() {
    if (!dragging) return;

    dragging = false;
    string.classList.remove("dragging");

    if (pullDistance >= pullThreshold) {
        const isOn = document.body.classList.toggle("light-on");

        lampSwitch.setAttribute("aria-pressed", String(isOn));

        lampSwitch.setAttribute(
            "aria-label",
            isOn
                ? "Pull down to turn lamp off"
                : "Pull down to turn lamp on"
        );

        hint.textContent = isOn
            ? "Pull the little ball down to turn off the light"
            : "Pull the little ball down to turn on the light";

        if (isOn) {
            setTimeout(function() {
                if (document.body.classList.contains("light-on")) {
                    username.focus();
                }
            }, 650);
        } else {
            message.textContent = "";
        }
    }

    // Return the string to its original position
    string.style.height = originalStringHeight + "px";
    pullDistance = 0;
}

lampSwitch.addEventListener("pointerup", releaseSwitch);

lampSwitch.addEventListener("pointercancel", function() {
    dragging = false;
    string.classList.remove("dragging");
    string.style.height = originalStringHeight + "px";
    pullDistance = 0;
});

// Login form demo
loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    if (!username.value.trim() || !password.value) {
        message.textContent = "Please enter your username and password.";
        return;
    }

    message.textContent =
        "Demo only. Connect a backend to authenticate.";
});
</script>

</body>
</html>
